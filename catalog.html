<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог товаров — ДомМаркет</title>
  <meta name="description" content="Каталог товаров для дома: посуда, текстиль, мебель, инструменты, декор. Более 12 000 наименований с доставкой по России.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accessible.css" id="theme-accessible-css" disabled>
</head>
<body data-page="catalog">
  <header id="site-header" class="site-header"></header>

  <nav class="breadcrumbs" aria-label="Хлебные крошки">
    <a href="index.html">Главная</a><span>/</span>Каталог товаров
  </nav>

  <div class="layout-catalog">
    <aside class="filter-panel" aria-label="Фильтры">
      <h3>Поиск по каталогу</h3>
      <input type="search" id="catalog-search" placeholder="Введите запрос…" style="width:100%;padding:10px;border:1px solid var(--color-border);border-radius:6px;margin-bottom:18px;">

      <h3>Категории</h3>
      <div class="filter-group" id="filter-cats"></div>

      <h3>Цена, ₽</h3>
      <div class="filter-group" style="display:flex;gap:8px;">
        <input type="number" id="filter-min" placeholder="от" min="0">
        <input type="number" id="filter-max" placeholder="до" min="0">
      </div>

      <h3>Дополнительно</h3>
      <div class="filter-group">
        <label><input type="checkbox" id="filter-sale"> Только со скидкой</label>
      </div>
    </aside>

    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <h1 style="margin:0;">Каталог товаров</h1>
        <span id="products-count" style="color:var(--color-text-muted);"></span>
      </div>
      <div class="products" id="products-grid"></div>
    </section>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initCatalog);
  </script>
</body>
</html>
